[/Script/Engine.InputSettings]
; VEIL uses the Enhanced Input system everywhere (UE 5.8).
-DefaultPlayerInputClass=/Script/Engine.PlayerInput
+DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
-DefaultInputComponentClass=/Script/Engine.InputComponent
+DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

; THE ENGINE'S EDITOR DEBUG KEYS HAVE NO BUSINESS IN A GAME.
; BaseInput.ini binds F1 to "viewmode wireframe", F2 to "viewmode unlit",
; F3 lit, F4 lit_detaillighting, F5 shadercomplexity - and they fire in a -game
; session, so pressing F1 for help turned the whole district into cyan
; wireframe. Clearing the array from here does NOT take effect in this build
; (tried "DebugExecBindings=" and "!DebugExecBindings=ClearArray"; the engine
; still ran the exec). AVEILPlayerController::InputKey therefore swallows
; F1-F5 itself before they reach the exec handler. Do not bind them here.
