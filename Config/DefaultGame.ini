[/Script/EngineSettings.GeneralProjectSettings]
; FGuid::ImportTextItem reads EXACTLY 32 hex digits (EGuidFormats::Digits) - no
; hyphens. The dashed form was rejected on every boot with "import failed for
; ProjectID", which is the error Unreal's Message Log showed. Same GUID, the
; format the engine actually parses.
ProjectID=451B8EACA89D495AA34731670EA913C3
ProjectName=VEIL: THE LAST SIGNAL
Description=Original sci-fi RPG - Prototype 01 foundation.

[/Script/Engine.AssetManagerSettings]
; GameFeatures refuses to function without a scan rule for its own asset type
; (Message Log: "Asset manager settings do not include a rule for assets of type
; GameFeatureData"). Two details decide whether the rule actually counts, both
; read from GameFeaturesSubsystem.cpp and AssetManagerTypes.cpp:
;  1. the check is GetPrimaryAssetRules(id).IsDefault(), and IsDefault compares
;     against a fresh FPrimaryAssetRules() (Priority=-1, ChunkId=-1,
;     bApplyRecursively=True, CookRule=Unknown) - so those exact values STILL
;     count as "no rule". CookRule=AlwaysCook makes it a real rule, and it is
;     also the correct semantic: game feature data must always cook.
;  2. bIsEditorOnly=True hides the type from the game build, which is where the
;     error was still firing, so it is False here.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass=/Script/GameFeatures.GameFeatureData,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/GameFeatures")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[StartupActions]
