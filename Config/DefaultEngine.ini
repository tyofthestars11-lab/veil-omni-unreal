[/Script/Engine.RendererSettings]
; Consolidated 2026-10-27 (repo is the single source the lane syncs
; from - PC-side ini surgery alone got clobbered by config syncs).
; RTX 3050 6 GB: Lumen on (software tracing), distance fields on,
; virtual shadows on with capped pages, TSR temporal upscaling at
; 66.6667% history (Google's block, checked against brief section 8).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
; STATIC LIGHTING OFF (2026-11-01). The editor was showing "LIGHTING NEEDS TO BE
; REBUILT (4,134 unbuilt objects)" in Play. This project is Lumen + Virtual Shadow
; Maps - there is nothing to bake, so the rebuild requirement was pure debt. With
; static lighting off, lights are fully dynamic and the world stops asking for a
; lightmass build it never needed. World Settings also sets
; bForceNoPrecomputedLighting at boot for the same reason.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; RAISED 2048 -> 4096 on 2026-11-01: the editor logged "Virtual Shadow Map Page
; Pool overflow (1245 page allocations were not served)" - a shortfall of 1245
; pages against a 2048 pool, i.e. the pool was barely half the scene's demand.
; Unserved pages mean missing shadows and an oversubscribed pool is exactly the
; kind of renderer state that turns into an access violation.
; NOT raising r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel: the doc in
; VirtualShadowMapArray.cpp says 32 needs 128bpp of TRANSIENT VRAM during the
; lighting pass, which on this 6 GB card would make things worse. The overflow
; there is a "too many local lights" scene problem, not a cvar problem.
; RAISED 4096 -> 8192 on 2026-11-02. The pool was raised once already and still
; reported unserved page allocations; a "One Pass Projection overflow" is that same
; shortfall seen from the other side - pages the projection pass asked for and did not
; get. One-pass projection is off as well, so a single pixel can no longer exhaust a
; projected page budget in the first place.
r.Shadow.Virtual.MaxPhysicalPages=8192
r.Shadow.Virtual.OnePassProjection=0
r.DynamicRes.OperationMode=0
r.AntiAliasingMethod=4
; r.MorphTarget.Enable=0 was removed on purpose. It IS a real cvar, but it only
; stops the render thread WRITING morph vertex buffers while the mesh asset still
; reports morph targets, so the reader asked the pool for a buffer that was never
; written and hit check(Index == 1) in SkeletalRenderGPUSkin.cpp:336 - the crash
; that kept killing the editor. Morphs are now disabled per component with
; bDisableMorphTarget (bone-driven bodies only), which is consistent for both sides.
r.TSR.History.ScreenPercentage=66.6667
r.TSR.Velocity.Quality=1
r.TSR.Sharpness=1.0
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceDistance=10000.0
r.Lumen.Reflections.Allow=1
; VEIL OMNI whole, 2026-10-31: video memory cooked fix, RTX 3050 6 GB.
; Tyree photos: 501-1615 MB over budget, 79k-81k objects, Non-Nanite
; shadow overflow, FPS 8-22 in Play. These caps are engine cvars, not
; code: unknown cvars warn, they do not break a build.
; Texture streaming pool, dropped ONE PHI RUNG on 2026-11-01 after MEASURING the
; card instead of trusting it: Windows reported 5,592.8 MB of dedicated VRAM in
; use of 6,002 MB (93.2%) with the editor merely sitting on VEILDistrict, which
; is the over-budget state the D3D12 crash came out of.
;   2048    -> rung 15.8446 -> back 2047.979
;   1265.73 -> rung 14.8446 -> back 1265.721   (2048 / phi, frees 782 MB)
; A second rung (782.21, rung 13.8446) was tried and REVERTED, measured not
; guessed: editor still reported "(352.85 MB over budget)" at 1266 and
; "(350.45 MB over budget)" at 782 - 2 MB of budget for 484 MB of texture
; cache. The demoted-memory figure is the driver's own local budget
; (D3D12Adapter.cpp: GDemotedLocalMemorySize = MemoryStats.DemotedLocal), not
; the streaming pool, so the pool stays at ONE rung and looks are not spent on
; a number it does not move.
r.Streaming.PoolSize=1266
; Lumen surface cache atlas, default 4096. Read from LumenScene.cpp:127 - the
; atlas is the biggest single Lumen allocation and it scales with area, so one
; halving is a quarter of its memory (192 MB of RGBA8 atlases back).
;   4096 -> rung 17.2850   2048 -> rung 15.8446
r.LumenScene.SurfaceCache.AtlasSize=2048
r.Streaming.LimitPoolSizeToVRAM=1
; Shadow cascades capped: fewer cascades, less shadow memory.
r.Shadow.CSM.MaxCascades=2
; Lumen scene + final gather capped for a 6 GB card.
r.LumenScene.Radiosity.ProbeSpacing=16
; 16 was four times the probe density of the default 32, and the phase lock paid for
; it by dropping the render to 45% - a soft frame is not a better-looking frame.
; Measured back at 32: the lock holds 60 fps and the screen percentage climbs.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
; Nanite: keep on (project already enables Nanite assets via Fab /
; editor). Triangle / pixel budget is set in editor per-mesh by
; Tools/veil_omni_render_opt.py - no cvar here claims a per-mesh fix.
r.Nanite.MaxPixelsPerEdge=1.0
; ---------------------------------------------------------------------------
; PHI LOOK, 2026-11-01: sharpness and a real sky gradient, not a flat wash.
;   r.Tonemapper.Sharpen  0.5  - the frame arrives through TSR at 66.7% history,
;                                which is soft; half a unit of sharpen puts the
;                                edge back without the ringing 1.0 gives.
;   r.VolumetricFog       0    - the height fog was already the veil; volumetric
;                                layers on top of it only cost milliseconds.
;   FastSkyLUT            0    - the fast LUT is what a cheap sky looks like. The
;                                sky here never moves, so the full LUT is paid once.
; All three are renderer cvars, not code: an unknown one warns, it never breaks a build.
r.Tonemapper.Sharpen=0.5
r.VolumetricFog=0
; FASTSKY IS ON HERE TOO. This block had it off while [SystemSettings] turned it on,
; so the two halves of one optimization disagreed and the renderer warned
; "FastAerialPerspective without FastSky". One value, in every section.
r.SkyAtmosphere.FastSkyLUT=1
; ---------------------------------------------------------------------------
; PHI PERF PASS, 2026-11-01 - measured against the phase lock, not guessed.
; The lock was holding 60 fps only at 45-55% screen percentage; these are the
; frame-time levers with the best saved-milliseconds-per-lost-pixel, from Epic's
; Lumen performance guide (r.Lumen.Reflections guidance) and the VSM docs:
;
;   MaxRoughnessToTrace 0.30   only genuinely glossy pixels trace a reflection;
;                              rougher ones fall back to Lumen's free rough
;                              specular. The district's stone is rough.
;   Reflections.DownsampleFactor 2   one ray per 2x2 quad.
;   MaxRoughnessToTraceForFoliage 0  Epic: "without compromising quality".
;   Shadow.Virtual.ResolutionLodBiasLocal 1   halves local VSM page resolution;
;                              the difference is not visible at 720p.
;   Shadow.Virtual.Clipmap.LastLevel 20   trims the farthest clipmap level.
;   LightCulling.MaxDistanceOverrideKilometers 0.3   the world is 2 km across;
;                              beyond 300 m the light grid stops carrying lights.
; Lumen scene radiosity probe spacing was deliberately NOT touched: Epic's forum
; reports no visible difference, only debug-view difference, for real cost.
r.Lumen.Reflections.MaxRoughnessToTrace=0.30
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0
r.Shadow.Virtual.ResolutionLodBiasLocal=1
r.Shadow.Virtual.Clipmap.LastLevel=20
r.LightCulling.MaxDistanceOverrideKilometers=0.3
; ---------------------------------------------------------------------------
; PHI VRAM LADDER - 2026-11-01, the D3D12 crash.
;
; READ, from Saved\Crashes\UECC-Windows-53862B8B...\:
;   Unhandled Exception: EXCEPTION_ACCESS_VIOLATION reading address
;   0xffffffffffffffff, crashed thread a render task, GPU breadcrumbs
;   "ParallelDraw (Index 2, Num 3) -> BasePass -> Scene", frame 14251.
;   Adapter: "6002MB of dedicated video memory".
; READ, from the editor frame the same day: "Video memory has been exhausted
;   (507 MB over budget)" at a 3840x2160 render of a 3996x2316 window.
; A render task that dereferences a resource with no GPU address is what a card
; that is already over budget produces. So the budget is fixed at its source
; instead of the crash being papered over: the editor viewport stops asking for
; 4K, and where it stops is a rung, not a taste.
;
; THE LADDER, each rung computed fresh as ln(value)/ln(phi), phi=1.6180339887,
; round-tripped back to the value:
;   editor screen percentage 61.8034  -> rung 8.5699  -> back 61.802092
;   editor max render px     1618     -> rung 15.3549 -> back 1618.021609
;   VSM physical pages       4096     -> rung 17.2850 -> back 4095.919021
;   streaming pool MB        2048     -> rung 15.8446 -> back 2047.979310
; 61.8034% of a 3840x2160 viewport is 3.17 MP (0.3820 of 4K, i.e. phi^-2); the
; 1618 px ceiling then holds the editor at 1.47 MP, 0.1775 of 4K.
; MEASURED after that viewport cut, 2026-11-01: still 505.60 MB over budget, so
; the pixels were not the whole story. Dedicated VRAM read 5,592.8 MB of 6,002.
; The remaining pressure is pooled memory (textures, Lumen atlas), so those are
; what the next rungs cut - see r.Streaming.PoolSize and the atlas below.
; The game is untouched by this: it renders through its own phi lock
; (VEILPerf, 60 fps phase lock), not through the editor viewport.
r.Editor.Viewport.ScreenPercentageMode.RealTime=0
r.Editor.Viewport.ScreenPercentage=61.8034
r.Editor.Viewport.MaxRenderingResolution=1618
r.Editor.Viewport.ScreenPercentageMode.NonRealTime=0

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/VEIL")

[SystemSettings]
; "FastAerialPerspective without FastSky": the aerial perspective LUT was asking
; for the fast path while the fast sky LUT was never enabled. Both on, so the two
; halves of the same optimization agree and the warning has nothing to report.
r.SkyAtmosphere.FastSkyLUT=1
; 0, not 1: FastApplyOnOpaque applies the fast aerial perspective inside the opaque
; pass, and the warning existed because that ran without the fast sky. With the fast
; sky LUT on, the documented pairing keeps the opaque fast-apply off so the LUT is not
; folded in twice in one frame.
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0

[/Script/NavigationSystem.RecastNavMesh]
; The real switch is RuntimeGeneration (ERuntimeGenerationType), not
; bRebuildAtRuntime - that key is not a RecastNavMesh property, so it was
; ignored and the navmesh stayed static with nothing baked: the game booted
; with no RecastNavMesh at all ("Unable to find RecastNavMesh instance while
; trying to create UCrowdManager"), which leaves every MoveTo call without a
; surface to path on. Dynamic builds it in-game, which suits a district the
; game also raises at runtime.
RuntimeGeneration=Dynamic
bRebuildAtRuntime=True
CellSize=19.0
CellHeight=10.0
AgentMaxSlope=45.0

